# Every message players see. {server}, {server_name}, {server_address} and {command} work everywhere.
# MiniMessage and &a codes both work.
# Set a message to "" to stop it from being sent.

prefix: "<dark_gray>[</dark_gray>{server}<dark_gray>]</dark_gray> "

general:
  no-permission: "<red>You do not have permission for that."
  players-only: "<red>Only players can do that."
  unknown-player: "<red>No player called <white>{player}</white> has joined before."
  module-disabled: "<red>The {module} module is turned off."
  reloaded: "<green>Everything was reloaded."
  saved: "<green>Player data saved."
  help: "<gray>{server_name}. Ops: <white>/{command}</white> opens the admin menu. <white>/balance /pay /baltop /shop /sell /role /sidebar /skin</white>."
  no-admin: "<red>You need the keystone.admin permission to open the admin menu. Ops have it automatically: type <white>op <your name></white> in the server console."

economy:
  balance: "<gray>Your balance: <green>{balance}"
  balance-other: "<gray>{player} has <green>{balance}"
  pay-usage: "<red>Usage: /pay <player> <amount>"
  pay-self: "<red>You cannot pay yourself."
  invalid-amount: "<red>That is not a valid amount. The minimum is {min}."
  not-enough: "<red>You do not have enough money. Balance: {balance}"
  paid: "<gray>You sent <green>{amount}</green> to <white>{player}</white>."
  received: "<gray>You received <green>{amount}</green> from <white>{player}</white>."
  baltop-header: "<gold>Richest players <gray>(page {page} of {pages})"
  baltop-line: "<gray>#{rank} <white>{player}</white>: <green>{balance}"
  eco-usage: "<red>Usage: /eco <give|take|set|reset> <player|*> [amount]"
  eco-done: "<gray>{player} now has <green>{balance}</green>."

rewards:
  block: "<green>+{amount}"
  mob: "<green>+{amount}"
  playtime: "<green>+{amount} <gray>for playing"

shop:
  empty: "<red>The shop has nothing in it yet."
  unknown-category: "<red>There is no shop category called {category}."
  category-lore: "<gray>{count} items. Click to open."
  lore-buy: "<gray>Buy {amount}: <green>{price}"
  lore-sell: "<gray>Sell {amount}: <gold>{price}"
  lore-hint-buy: "<dark_gray>Left click to buy, shift for a stack"
  lore-hint-buy-once: "<dark_gray>Left click to buy"
  lore-hint-sell: "<dark_gray>Right click to sell, shift to sell all"
  button-back: "<yellow>Back"
  button-previous: "<yellow>Previous page"
  button-next: "<yellow>Next page"
  button-close: "<red>Close"
  button-balance: "<gray>Balance: <green>{balance}"
  bought: "<gray>Bought <white>{amount}x {item}</white> for <green>{price}</green>."
  sold: "<gray>Sold <white>{item}</white> for <gold>{price}</gold>."
  sold-total: "<gray>You earned <gold>{price}</gold>."
  nothing-to-sell: "<red>You have nothing that can be sold here."
  not-sellable: "<red>This item cannot be sold."
  not-buyable: "<red>This item cannot be bought."
  hold-item: "<red>Hold the item you want to add in your main hand."
  usage-add: "<red>Usage: /shop add <category> <buy price> [sell price]. Use -1 to turn a side off."
  usage-category: "<red>Usage: /shop category <id> <icon> [name]"
  usage-edit: "<red>Usage: /shop <remove|price|command|giveitem|permission> <category> <id> [value]"
  unknown-material: "<red>Unknown item: {material}"
  unknown-item: "<red>No item {id} in category {category}. See /shop list."
  added: "<green>Added <white>{id}</white> to <white>{category}</white>."
  item-saved: "<green>Saved <white>{category}.{id}</white>."
  category-saved: "<green>Saved category <white>{category}</white>."
  category-deleted: "<green>Deleted category <white>{category}</white>."
  list-line: "<gold>{category}<gray>: {items}"

sellmenu:
  title: "<dark_gray>Drop items to sell"
  sell-button: "<green><bold>Sell for {price}"
  sell-lore: "<gray>{count} items can be sold. Closing this menu sells them too."
  unsellable-lore: "<red>{count} items cannot be sold and will be given back."
  cancel-button: "<red>Cancel and take everything back"
  sold: "<gray>Sold <white>{count}</white> items for <gold>{price}</gold>."
  balance-full: "<red>Your balance is at the limit, so your items were given back."

auction:
  title: "<dark_gray>Auction house"
  confirm-title: "<dark_gray>Buy this item?"
  mine-title: "<dark_gray>Your listings"
  collection-title: "<dark_gray>Your collection"
  usage: "<red>Usage: /ah, /ah sell <price>, /ah search <text>, /ah mine, /ah collect"
  lore-price: "<gray>Price: <gold>{price}"
  lore-seller: "<gray>Seller: <white>{seller}"
  lore-time: "<gray>Ends in: <white>{time}"
  lore-click-buy: "<yellow>Click to buy"
  lore-yours: "<aqua>This is your listing"
  lore-admin-remove: "<red>Shift right click to remove (admin)"
  lore-click-cancel: "<yellow>Click to take it off the market"
  lore-click-claim: "<yellow>Click to take it"
  button-help: "<gold>How to sell"
  help-lore: "<gray>Hold an item and type <white>/ah sell <price>"
  button-mine: "<gold>Your listings"
  mine-lore: "<gray>{count} of {max} used"
  button-search: "<gold>Search"
  search-lore: "<gray>Find items by name or seller"
  search-clear-lore: "<gray>Left click new search, right click show everything"
  search-question: "What are you looking for?"
  button-collection: "<gold>Collection"
  collection-lore: "<gray>{count} items waiting for you"
  button-refresh: "<yellow>Refresh"
  button-confirm: "<green><bold>Buy for {price}"
  balance-lore: "<gray>Your balance: <green>{balance}"
  button-cancel: "<red>Cancel"
  button-claim-all: "<green>Take everything"
  hold-item: "<red>Hold the item you want to sell in your main hand."
  bad-price: "<red>The price has to be between {min} and {max}."
  too-many: "<red>You already have {max} items for sale."
  cannot-pay-fee: "<red>You need {fee} to pay the listing fee."
  listed: "<gray>Listed <white>{amount}x {item}</white> for <gold>{price}</gold> for {time}. Fee paid: {fee}."
  gone: "<red>That item is no longer for sale."
  own-item: "<red>You cannot buy your own item."
  seller-full: "<red>The seller cannot receive more money right now."
  bought: "<gray>You bought <white>{amount}x {item}</white> from {seller} for <gold>{price}</gold>."
  sold-notify: "<green>{buyer} bought your {amount}x {item}. You got <gold>{price}</gold>."
  cancelled: "<gray>{item} was taken off the market."
  expired: "<gray>Your {item} did not sell and is waiting in your collection (/ah collect)."
  to-collection: "<gray>Your inventory is full, so it went to your collection (/ah collect)."
  inventory-full: "<red>Make some room in your inventory first."

roles:
  usage: "<red>Usage: /role <list|info|create|delete|set|prefix|suffix|display|priority|color|chatformat|multiplier|addperm|delperm|inherit|uninherit|who>"
  who: "<white>{player}</white> <gray>has the role</gray> <white>{role}</white>"
  list-line: "<gray>{priority} <white>{role}</white> ({display}) {prefix}"
  info: "<gold>{role}</gold> <gray>display {display}, priority {priority}, multiplier x{multiplier}<newline>prefix: </gray>{prefix}<reset><gray> suffix: </gray>{suffix}<reset><newline><gray>inherits: {inherits}<newline>permissions: {permissions}"
  exists: "<red>The role {role} already exists."
  unknown: "<red>There is no role called {role}."
  created: "<green>Created role <white>{role}</white>. Set it up with /role prefix, addperm and so on."
  deleted: "<green>Deleted role <white>{role}</white>."
  cannot-delete-default: "<red>You cannot delete the default role. Change default-role in roles.yml first."
  set: "<green>{player} is now <white>{role}</white>."
  updated: "<green>Updated role <white>{role}</white>."

sidebar:
  usage: "<red>Usage: /sidebar [toggle|list|show|create|delete|title|addtitle|add|set|insert|remove|roles|worlds]"
  hidden: "<gray>Sidebar hidden. Type /sidebar to show it again."
  shown: "<gray>Sidebar shown."
  list-line: "<gold>{board}</gold> <gray>for {roles}, {lines} lines"
  show-title: "<gray>title {n}: <white>{text}"
  show-line: "<gray>line {n}: <white>{text}"
  exists: "<red>A board called {board} already exists."
  unknown: "<red>There is no board called {board}."
  created: "<green>Created board <white>{board}</white>. Add lines with /sidebar add {board} <text>."
  updated: "<green>Updated board <white>{board}</white>."
  too-many: "<red>A sidebar can show at most 15 lines."
  bad-line: "<red>Pick a line number from 1 to {max}."

auth:
  register-prompt: "<yellow>Welcome! Create a password with <white>/register <password> <password></white>"
  register-title: "<gold>Welcome"
  register-subtitle: "<gray>/register <password> <password>"
  login-prompt: "<yellow>Welcome back! Log in with <white>/login <password></white>"
  login-title: "<gold>Welcome back"
  login-subtitle: "<gray>/login <password>"
  register-usage: "<red>Usage: /register <password> <password>"
  login-usage: "<red>Usage: /login <password>"
  change-usage: "<red>Usage: /changepassword <old password> <new password>"
  login-first: "<red>Log in first."
  registered: "<green>Account created. You are logged in."
  logged-in: "<green>Logged in. Have fun!"
  session-resumed: "<green>Welcome back, you were logged in automatically."
  logged-out: "<gray>You are logged out."
  password-changed: "<green>Your password was changed."
  already-logged-in: "<red>You are already logged in."
  already-registered: "<red>This account already has a password. Use /login."
  not-registered: "<red>This account has no password yet. Use /register."
  no-match: "<red>The two passwords are not the same."
  too-short: "<red>Your password needs at least {min} characters."
  too-long: "<red>Your password can have at most {max} characters."
  too-many-accounts: "<red>Your connection already has {max} accounts."
  wrong-password: "<red>Wrong password. Attempts left: {left}"
  busy: "<gray>One moment..."
  kick-timeout: "<red>You took too long to log in."
  kick-attempts: "<red>Too many wrong passwords."
  kick-bad-name: "<red>Names may only use letters, numbers and _ (3 to 16 characters)."
  kick-already-online: "<red>Someone with this name is already playing."
  kick-wrong-case: "<red>This account is registered as <white>{name}</white>. Join with exactly that name."
  admin-usage: "<red>Usage: /authadmin <forcelogin|unregister|setpassword|info> <player> [password]"
  admin-done: "<green>Done for {player}."
  admin-info: "<gold>{player}</gold> <gray>registered: {registered}, last ip: {ip}, last login: {last}"

skins:
  usage: "<red>Usage: /skin <name>, /skin reset, /skin update or /skin set <player> <name>"
  bad-name: "<red>That is not a valid Minecraft name."
  loading: "<gray>Looking up the skin of {name}..."
  failed: "<red>Mojang could not be reached, try again in a minute."
  not-premium: "<red>{name} is not a premium account, so it has no skin."
  changed: "<green>{player} now wears the skin of <white>{name}</white>."
